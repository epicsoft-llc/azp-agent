stages:
  - build
  - release

image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_REGISTRY: "epicsoft/azp-agent"

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_TOKEN"

after_script:
  - docker logout $CI_REGISTRY
  - docker logout

Alpine:
  stage: build
  variables:
    VERSION: "alpine"
  script:
    - echo "Build Docker image for azp-agent with version '${VERSION}'"
    - docker build . -f "Dockerfile.${VERSION}"
        --push --pull --no-cache
        -t ${CI_REGISTRY_IMAGE}:${VERSION}
        -t ${CI_REGISTRY_IMAGE}:${VERSION}-latest
        -t ${DOCKER_REGISTRY}:${VERSION}
        -t ${DOCKER_REGISTRY}:${VERSION}-latest
        --build-arg IMAGE_TAG=${VERSION}
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  tags: [ "image" ]
  only: [ "main" ]

Ubuntu22.04:
  stage: build
  variables:
    VERSION: "ubuntu22.04"
  script:
    - echo "Build Docker image for azp-agent with version '${VERSION}'"
    - docker build . -f "Dockerfile.${VERSION}"
        --push --pull --no-cache
        -t ${CI_REGISTRY_IMAGE}:${VERSION}
        -t ${CI_REGISTRY_IMAGE}:${VERSION}-latest
        -t ${DOCKER_REGISTRY}:${VERSION}
        -t ${DOCKER_REGISTRY}:${VERSION}-latest
        --build-arg IMAGE_TAG=${VERSION}
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  tags: [ "image" ]
  only: [ "main" ]

Ubuntu24.04:
  stage: build
  variables:
    VERSION: "ubuntu24.04"
  script:
    - echo "Build Docker image for azp-agent with version '${VERSION}'"
    - docker build . -f "Dockerfile.${VERSION}"
        --push --pull --no-cache
        -t ${CI_REGISTRY_IMAGE}:${VERSION}
        -t ${CI_REGISTRY_IMAGE}:${VERSION}-latest
        -t ${CI_REGISTRY_IMAGE}:latest
        -t ${DOCKER_REGISTRY}:${VERSION}
        -t ${DOCKER_REGISTRY}:${VERSION}-latest
        -t ${DOCKER_REGISTRY}:latest
        --build-arg IMAGE_TAG=${VERSION}
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  tags: [ "image" ]
  only: [ "main" ]

uploadReadme:
  stage: release
  before_script: ""
  script:
    - docker run --rm -v $PWD:/workspace
      -e DOCKERHUB_USERNAME=${DOCKER_HUB_USER}
      -e DOCKERHUB_PASSWORD=${DOCKER_HUB_TOKEN}
      -e DOCKERHUB_REPOSITORY=${DOCKER_REGISTRY}
      -e SHORT_DESCRIPTION="Docker image for Self-Hosted Azure pipelines agent"
      -e README_FILEPATH='/workspace/README.md'
        peterevans/dockerhub-description:latest
  retry: 2
  only: [ "main" ]
